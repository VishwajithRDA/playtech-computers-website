<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playtech (Pvt) Ltd | Coming Soon</title>

    <link rel="icon" type="image/x-icon" href="./favicon.ico">

    <!-- Load Tailwind CSS via CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configure your exact Playtech / Playtech (Pvt) Ltd brand colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0b0f19', /* Deep Dark Slate */
                        card: '#161b2b',       /* Slate-900 surfaces */
                        primary: '#e62424',    /* Racing Red */
                        accent: '#9e1414',     /* Crimson Fold */
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Premium tech grid background and glowing effects */
        body {
            background-color: #0b0f19;
            background-image:
                radial-gradient(circle at center, rgba(230, 36, 36, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-position: center center;
        }

        .glow-text {
            text-shadow: 0 0 30px rgba(230, 36, 36, 0.6);
        }

        .glass-panel {
            background: rgba(22, 27, 43, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col items-center justify-center overflow-hidden relative">

    <!-- Ambient Red Center Glow -->
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/20 rounded-full blur-[150px] pointer-events-none">
    </div>

    <main class="relative z-10 w-full max-w-4xl px-6 py-12 flex flex-col items-center text-center">

        <!-- Status Badge -->
        <div
            class="inline-flex items-center gap-3 px-4 py-2 rounded-full glass-panel border border-primary/40 text-primary text-xs md:text-sm font-bold mb-8 uppercase tracking-widest shadow-[0_0_15px_rgba(230,36,36,0.2)]">
            <span class="w-2.5 h-2.5 rounded-full bg-primary animate-pulse"></span>
            System Upgrade in Progress
        </div>

        <!-- Main Branding -->
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter mb-4 text-white">
            Playtech <span class="text-primary glow-text">(Pvt) Ltd</span>
        </h1>
        <h2 class="text-xl md:text-2xl font-medium text-slate-300 mb-8 tracking-wide">
            Elevate your Digital Experience
        </h2>
        <p class="text-slate-400 max-w-2xl mx-auto mb-12 text-lg leading-relaxed">
            Different Level Computer Shop in Kuliyapitiya with Amazing Service and Branded Computers
        </p>

        <!-- Dynamic Countdown Timer -->
        <div class="flex gap-4 md:gap-6 mb-12 text-center" id="countdown">
            <div class="glass-panel border border-slate-800 rounded-xl p-4 w-24 md:w-32 shadow-lg">
                <div id="days" class="text-3xl md:text-5xl font-black text-white mb-1">00</div>
                <div class="text-xs md:text-sm text-slate-400 uppercase font-semibold">Days</div>
            </div>
            <div class="glass-panel border border-slate-800 rounded-xl p-4 w-24 md:w-32 shadow-lg">
                <div id="hours" class="text-3xl md:text-5xl font-black text-white mb-1">00</div>
                <div class="text-xs md:text-sm text-slate-400 uppercase font-semibold">Hours</div>
            </div>
            <div class="glass-panel border border-slate-800 rounded-xl p-4 w-24 md:w-32 shadow-lg">
                <div id="minutes" class="text-3xl md:text-5xl font-black text-white mb-1">00</div>
                <div class="text-xs md:text-sm text-slate-400 uppercase font-semibold">Minutes</div>
            </div>
            <div class="glass-panel border border-slate-800 rounded-xl p-4 w-24 md:w-32 shadow-lg hidden md:block">
                <div id="seconds" class="text-3xl md:text-5xl font-black text-primary mb-1">00</div>
                <div class="text-xs md:text-sm text-slate-400 uppercase font-semibold">Seconds</div>
            </div>
        </div>

        <!-- Email Notification Form -->
        <form class="flex flex-col md:flex-row w-full max-w-lg gap-3"
            onsubmit="event.preventDefault(); alert('You have been added to the VIP notification list!');">
            <input type="email" placeholder="Enter your email address" required
                class="flex-1 glass-panel border border-slate-700 rounded-lg px-5 py-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-white placeholder-slate-500">
            <button type="submit"
                class="bg-primary hover:bg-accent text-white px-8 py-4 rounded-lg font-bold transition-all shadow-[0_0_20px_rgba(230,36,36,0.4)] hover:shadow-[0_0_30px_rgba(230,36,36,0.6)] whitespace-nowrap">
                Notify Me
            </button>
        </form>

        <!-- Store Meta -->
        <div
            class="mt-16 pt-8 border-t border-slate-800/50 w-full max-w-2xl flex flex-col md:flex-row justify-center items-center gap-6 text-sm text-slate-500 font-medium">
            <span class="flex items-center gap-2">
                <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                No 63, Hettipola Road, , Kuliyapitiya, Sri Lanka
            </span>
            <span class="hidden md:inline text-slate-700">|</span>
            <span class="flex items-center gap-2">
                <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
                    </path>
                </svg>
                +94 71 757 5240
            </span>
        </div>

    </main>

    <!-- Interactive JS for the Countdown -->
    <script>
        // Set launch date to 14 days from right now for demonstration
        const launchDate = new Date('2026-07-26');
        // launchDate.setDate(launchDate.getDate() + 14);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate.getTime() - now;

            if (distance < 0) return;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>

</html>
