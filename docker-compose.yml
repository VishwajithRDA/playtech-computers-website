version: '3.8'

services:
  backend:
    build: ./backend
    container_name: playtech_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production

  frontend:
    build: ./frontend
    container_name: playtech_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: playtech_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend